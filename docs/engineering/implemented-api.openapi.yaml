openapi: 3.1.0
info:
  title: Sovra implemented control-plane API (G1)
  version: 0.11.0
  description: >-
    Exact contract of the implemented backend (SOV-005 through SOV-015, SOV-029).
    Compatibility rules (versioning, origins, audiences, scopes,
    pagination, ETags, RFC 9457 negotiation, idempotency) are specified
    in docs/engineering/api-compatibility.md. Each operation lists its
    authorizing roles in x-sovra-scopes. Clients that send
    Accept: application/problem+json receive RFC 9457 problem details
    (type/title/status plus Sovra code/correlationId/retryable) instead
    of the legacy bodies; 404s stay empty in both variants. Mutation
    preconditions beyond single-shot 409s, async jobs, and cursor
    pagination beyond audit events are reserved, not implemented.
    Authentication is a Bearer service-account token except for the
    public probes, federation metadata, and OpenID4VCI/OpenID4VP
    wallet calls (bound to single-use grants, tokens, and sessions).
    The /api/bff/* chain instead authenticates by BFF session cookie
    (OIDC auth code with forced S256 PKCE; login entries are
    /oauth2/authorization/sovra and /login/oauth2/code/sovra).
    Authority checks are identical on both chains. BFF mutations
    require an X-XSRF-TOKEN header matching the readable XSRF-TOKEN
    cookie. Issuance and request creation stay machine-only: they are
    back-office operations, not holder actions.
    Error bodies are minimal by design:
    404s carry empty bodies (never confirm or deny another tenant's
    objects), 403s carry only a machine-readable reason code.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      operationId: health
      x-sovra-scopes: []
      summary: Public liveness probe with build identity
      security: []
      responses:
        '200':
          description: UP with service name and version
  /api/health/ready:
    get:
      operationId: readiness
      x-sovra-scopes: []
      summary: >-
        Public semantic flow readiness (SOV-029). Liveness says the
        process answers; readiness says the flow can proceed. 200 READY
        only when every dependency probe is UP, otherwise 503 with the
        sanitized per-check report. Details carry fixed codes and
        numbers only, never exception text or identity data.
      security: []
      responses:
        '200':
          description: >-
            {status READY, checks[{name, status UP, code, detail,
            durationMs}]}
        '503':
          description: >-
            {status NOT_READY, checks[...]} with at least one
            DEGRADED/DOWN check
  /api/alerts:
    get:
      operationId: listAlerts
      x-sovra-scopes: [AUDIT_READER, TRUST_ADMIN]
      summary: >-
        Active security alerts derived from semantic readiness
        (SOV-029). Global derived state with fixed names, severities,
        and codes; no tenant data.
      responses:
        '200':
          description: >-
            [{alert, severity critical|high|medium, status, code, check,
            firstObservedAt, observedAt}]
        '401': { description: Anonymous }
        '403': { description: Lacks AUDIT_READER/TRUST_ADMIN }
  /api/telemetry/summary:
    get:
      operationId: telemetrySummary
      x-sovra-scopes: [TENANT_MEMBER, AUDIT_READER, TRUST_ADMIN]
      summary: >-
        Sanitized stage timings and reason metrics for the caller's
        own tenant (SOV-029). Fixed stage/outcome names with durations
        and counts only; no request content or error text.
      responses:
        '200':
          description: >-
            {stages: {ISSUANCE_ISSUE|CONSENT_CREATE|CONSENT_DECIDE|
            VERIFICATION_VERIFY: {count, p50Ms, p95Ms, maxMs,
            outcomes}}, reasons: [{action, decision, reasonCode,
            count}]}
        '401': { description: Anonymous }
        '403': { description: Lacks TENANT_MEMBER/AUDIT_READER/TRUST_ADMIN }
  /api/telemetry/canary:
    post:
      operationId: runCanary
      x-sovra-scopes: [TENANT_MEMBER, AUDIT_READER, TRUST_ADMIN]
      summary: >-
        Success/failure canary over the log, error, metric, and
        fixture-model containment paths (SOV-029). Takes no input;
        the server-side sentinel is never echoed. The model probe is
        deterministic and labeled FIXTURE (no model call).
      responses:
        '200':
          description: >-
            {synthetic true, mode FIXTURE, channels {logs, errors,
            metrics, modelFixture {label, caseId, contained, noPath}},
            contained}
        '401': { description: Anonymous }
        '403': { description: Lacks TENANT_MEMBER/AUDIT_READER/TRUST_ADMIN }
  /api/whoami:
    get:
      operationId: whoami
      x-sovra-scopes: [authenticated]
      summary: Caller identity without secrets
      responses:
        '200': { description: accountId, tenantId, name, roles }
        '401': { description: Missing, unknown, revoked, or expired token }
  /api/auth/service-accounts:
    post:
      operationId: createServiceAccount
      x-sovra-scopes: [TRUST_ADMIN]
      summary: >-
        Create a machine-chain credential (SOV-006). The token is
        returned once in the 201 body and never readable afterwards;
        only its hash is stored. Roles must be a non-empty subset of
        the known roles; expiry, when given, must be in the future.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, roles]
              properties:
                name: { type: string, description: 1 to 128 chars }
                roles:
                  type: array
                  items: { type: string }
                  description: >-
                    Non-empty subset of TENANT_MEMBER, ISSUER_OPS,
                    RP_CLIENT, TRUST_ADMIN, AUDIT_READER
                expiresAt:
                  type: string
                  format: date-time
                  description: Optional; must be in the future
      responses:
        '201': { description: '{id, name, roles, revoked false, expiresAt, createdAt, token one-time}' }
        '400': { description: Invalid name, roles, or expiry }
        '401': { description: Anonymous }
        '403': { description: Lacks TRUST_ADMIN }
    get:
      operationId: listServiceAccounts
      x-sovra-scopes: [TRUST_ADMIN]
      summary: >-
        List the caller's tenant service accounts, oldest first.
        Views never include token material.
      responses:
        '200': { description: '[{id, name, roles, revoked, expiresAt, createdAt}]' }
        '401': { description: Anonymous }
        '403': { description: Lacks TRUST_ADMIN }
  /api/auth/service-accounts/{id}:
    get:
      operationId: getServiceAccount
      x-sovra-scopes: [TRUST_ADMIN]
      summary: Inspect one service account; the view never includes token material
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: '{id, name, roles, revoked, expiresAt, createdAt}' }
        '400': { description: Malformed id }
        '401': { description: Anonymous }
        '403': { description: Lacks TRUST_ADMIN }
        '404': { description: Unknown or other-tenant account (empty body) }
  /api/auth/service-accounts/{id}/rotate:
    post:
      operationId: rotateServiceAccount
      x-sovra-scopes: [TRUST_ADMIN]
      summary: >-
        Replace the credential with a fresh one-time token. The old
        token stops working immediately. Revoked accounts stay
        revoked: rotation refuses and the operator creates a new
        account instead.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresAt:
                  type: string
                  format: date-time
                  description: Optional new expiry; must be in the future; absent clears it
      responses:
        '200': { description: '{id, name, roles, revoked false, expiresAt, createdAt, token one-time}' }
        '400': { description: Malformed id or non-future expiry }
        '401': { description: Anonymous }
        '403': { description: Lacks TRUST_ADMIN }
        '404': { description: Unknown or other-tenant account (empty body) }
        '409': { description: Account is revoked (service_account_conflict) }
  /api/auth/service-accounts/{id}/revoke:
    post:
      operationId: revokeServiceAccount
      x-sovra-scopes: [TRUST_ADMIN]
      summary: >-
        Terminally revoke the credential. Revocation is idempotent:
        re-revoking returns the revoked view.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: '{id, name, roles, revoked true, expiresAt, createdAt}' }
        '400': { description: Malformed id }
        '401': { description: Anonymous }
        '403': { description: Lacks TRUST_ADMIN }
        '404': { description: Unknown or other-tenant account (empty body) }
  /api/vault/objects:
    post:
      operationId: storeVaultObject
      x-sovra-scopes: [ISSUER_OPS]
      summary: >-
        Seal source bytes as vault object version 1 (SOV-016).
        Content is base64; the optional digest pin must match.
        Returns identity only, never ciphertext or key material.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuerId, purposes, contentBase64]
              properties:
                issuerId: { type: string }
                displayName: { type: string }
                purposes:
                  type: array
                  items: { type: string }
                  description: 1 to 16 names matching [a-z0-9-]{1,64}
                contentBase64: { type: string, description: 1 to 16777200 bytes decoded }
                contentSha256Hex: { type: string, description: Optional pinned digest }
      responses:
        '201': { description: '{objectId, version 1}' }
        '400': { description: Malformed shape, bounds, or digest mismatch }
        '401': { description: Anonymous }
        '403': { description: Lacks ISSUER_OPS, or caller uploads disabled under synthetic-only demo (demo_synthetic_only) }
        '503': { description: Wrapping backend unavailable (kms_unavailable) }
  /api/vault/objects/{id}/versions:
    post:
      operationId: storeVaultVersion
      x-sovra-scopes: [ISSUER_OPS]
      summary: >-
        Seal a new version of an object under a fresh DEK.
        Re-encryption always mints a version; versions are immutable.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purposes, contentBase64]
              properties:
                purposes:
                  type: array
                  items: { type: string }
                contentBase64: { type: string }
                contentSha256Hex: { type: string }
      responses:
        '201': { description: '{objectId, version}' }
        '400': { description: Malformed shape, bounds, or digest mismatch }
        '401': { description: Anonymous }
        '403': { description: Lacks ISSUER_OPS, or caller uploads disabled under synthetic-only demo (demo_synthetic_only) }
        '404': { description: Unknown or other-tenant object (empty body) }
        '503': { description: Wrapping backend unavailable (kms_unavailable) }
  /api/vault/objects/{id}:
    get:
      operationId: readVaultMetadata
      x-sovra-scopes: [TENANT_MEMBER, ISSUER_OPS, AUDIT_READER, TRUST_ADMIN]
      summary: >-
        Read object metadata: versions, purposes, KEK versions,
        statuses, digests. Never content or key material.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: '{objectId, issuerId, displayName, versions[]}' }
        '401': { description: Anonymous }
        '403': { description: Lacks a metadata role }
        '404': { description: Unknown or other-tenant object (empty body) }
  /api/vault/objects/{id}/versions/{version}/read:
    post:
      operationId: readVaultVersion
      x-sovra-scopes: [TENANT_MEMBER, ISSUER_OPS]
      summary: >-
        Release one version's plaintext to a live, exactly-matching
        grant: same principal, object, version, purpose, workload,
        unrevoked, unexpired. Tampered rows fail closed with
        vault_integrity_failure and no plaintext.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grantId, purpose, workload]
              properties:
                grantId: { type: string, format: uuid }
                purpose: { type: string }
                workload: { type: string }
      responses:
        '200': { description: '{objectId, version, contentSha256Hex, contentBase64}' }
        '401': { description: Anonymous }
        '403': { description: Lacks a read role, or grant invalid/expired/revoked (reason codes GRANT_INVALID, GRANT_EXPIRED, GRANT_REVOKED) }
        '404': { description: Unknown object, version, or grant (empty body) }
        '500': { description: Ciphertext/context/key mismatch (vault_integrity_failure, never plaintext) }
        '503': { description: Wrapping backend unavailable (kms_unavailable) }
  /api/vault/objects/{id}/versions/{version}/delete:
    post:
      operationId: deleteVaultVersion
      x-sovra-scopes: [TRUST_ADMIN]
      summary: >-
        Terminally mark one version DELETED; reads refuse
        afterwards. Idempotent. Purging bytes stays a reviewed
        owner operation.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: '{objectId, version, status DELETED}' }
        '401': { description: Anonymous }
        '403': { description: Lacks TRUST_ADMIN }
        '404': { description: Unknown or other-tenant object/version (empty body) }
  /api/vault/grants:
    post:
      operationId: grantVaultAccess
      x-sovra-scopes: [ISSUER_OPS]
      summary: >-
        Issue a short-lived purpose- and workload-bound grant for
        one object version. The purpose must belong to the
        version's authorized set; TTL 60 to 86400 seconds.
        Defaults to a self grant for service callers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objectId, objectVersion, purpose, workload, ttlSeconds]
              properties:
                objectId: { type: string, format: uuid }
                objectVersion: { type: integer }
                principalType:
                  type: string
                  description: service_account (default) or human_membership
                principalId: { type: string, format: uuid, description: Defaults to the caller }
                purpose: { type: string }
                workload: { type: string }
                ttlSeconds: { type: integer }
      responses:
        '201': { description: '{grantId, objectId, objectVersion, principalType, principalId, purpose, workload, revoked false, expiresAt, createdAt}' }
        '400': { description: Malformed shape, TTL, unknown purpose, or widened purpose }
        '401': { description: Anonymous }
        '403': { description: Lacks ISSUER_OPS }
        '404': { description: Unknown object/version or principal (empty body) }
  /api/vault/grants/{id}/revoke:
    post:
      operationId: revokeVaultGrant
      x-sovra-scopes: [ISSUER_OPS, TRUST_ADMIN]
      summary: >-
        Terminally revoke a grant; reads under it refuse
        immediately. Idempotent.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Grant view with revoked true }
        '401': { description: Anonymous }
        '403': { description: Lacks a revocation role }
        '404': { description: Unknown or other-tenant grant (empty body) }
  /api/vault/keys/rotate:
    post:
      operationId: rotateVaultKek
      x-sovra-scopes: [TRUST_ADMIN]
      summary: >-
        Mint the next tenant wrapping-key version; new seals use
        it while older versions keep unwrapping their data.
      responses:
        '200': { description: '{kekVersion}' }
        '401': { description: Anonymous }
        '403': { description: Lacks TRUST_ADMIN }
  /api/quarantine/admissions:
    post:
      operationId: admitQuarantineBytes
      x-sovra-scopes: [ISSUER_OPS]
      summary: >-
        Admit hostile bytes into sealed quarantine (SOV-017). Content
        is base64 (1 to 8388608 bytes decoded) and must sniff as an
        allowlisted image type; it seals as a quarantine-marked vault
        object for the isolated worker. Returns identity only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentBase64, issuerId]
              properties:
                contentBase64: { type: string, description: 1 to 8388608 bytes decoded }
                claimedType: { type: string, description: Uploader label only, never trusted }
                issuerId: { type: string }
      responses:
        '202': { description: '{admissionId, objectId, status QUARANTINED, actualType, sizeBytes}' }
        '400': { description: Malformed shape, bounds, or non-allowlisted magic }
        '401': { description: Anonymous }
        '403': { description: Lacks ISSUER_OPS, or caller uploads disabled under synthetic-only demo (demo_synthetic_only) }
        '503': { description: Wrapping backend unavailable (kms_unavailable) }
  /api/quarantine/admissions/{id}:
    get:
      operationId: readQuarantineAdmission
      x-sovra-scopes: [ISSUER_OPS, AUDIT_READER, TRUST_ADMIN]
      summary: >-
        Read admission metadata and the worker verdict
        (SOV-017). Metadata-only: no endpoint serves quarantine bytes.
      responses:
        '200':
          description: >-
            {admissionId, objectId, status, claimedType, actualType,
            sizeBytes, contentSha256Hex, verdict, imageWidth,
            imageHeight, scannedAt, createdAt}
        '401': { description: Anonymous }
        '403': { description: Lacks a verdict-reading role }
        '404': { description: Unknown admission }
  /api/quarantine/admissions/{id}/promote:
    post:
      operationId: promoteQuarantineAdmission
      x-sovra-scopes: [ISSUER_OPS]
      summary: >-
        Promote a CLEAN admission (SOV-017): the quarantine seal opens
        server-side under the caller's scan grant and re-seals into a
        fresh vault object with real purposes. The admission flips to
        PROMOTED exactly once; anything else conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grantId, purpose, workload]
              properties:
                grantId: { type: string, format: uuid }
                purpose: { type: string }
                workload: { type: string }
                purposes:
                  type: array
                  items: { type: string }
                  description: Promoted purposes, default [enrollment-review]
                displayName: { type: string }
      responses:
        '201': { description: '{admissionId, objectId, version 1}' }
        '400': { description: Malformed shape or quarantine purpose in promoted set }
        '401': { description: Anonymous }
        '403': { description: Lacks ISSUER_OPS, or scan grant invalid }
        '404': { description: Unknown admission, object, or grant }
        '409': { description: Admission is not CLEAN, or already promoted }
  /api/extraction/records:
    post:
      operationId: runExtraction
      x-sovra-scopes: [ISSUER_OPS]
      summary: >-
        Run local extraction (SOV-018) over one vault source version
        through a purpose grant. The profile engine reads the bytes,
        fields normalize under normalizer-v1, and revision 1 stores
        per-field canonical/exact digests. One record per
        source/engine; a repeat run conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vaultObjectId, objectVersion, grantId, purpose, workload, schemaId]
              properties:
                vaultObjectId: { type: string, format: uuid }
                objectVersion: { type: integer, minimum: 1 }
                grantId: { type: string, format: uuid }
                purpose: { type: string }
                workload: { type: string }
                schemaId: { type: string, description: Engine schema, demo fixture-doc-v1 }
      responses:
        '201': { description: '{recordId, revision 1, sourceDigestHex}' }
        '400': { description: Wrong source, unknown schema, or malformed shape }
        '401': { description: Anonymous }
        '403': { description: Lacks ISSUER_OPS, or source grant invalid }
        '404': { description: Unknown object, version, or grant }
        '409': { description: Extraction already exists for this source version }
  /api/extraction/records/{id}:
    get:
      operationId: readExtractionRecord
      x-sovra-scopes: [ISSUER_OPS, AUDIT_READER, TRUST_ADMIN]
      summary: >-
        Read an extraction record with its full provenance (SOV-018):
        source object and digest, engine/schema/normalizer/canon
        identifiers, every revision with observed/normalized fields
        and per-field digests, and the approval pointer. Digests are
        integrity references; no endpoint resolves by digest.
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
          description: Strong ETag from a previous read; matches answer 304
      responses:
        '200':
          description: >-
            {recordId, vaultObjectId, objectVersion, sourceDigestHex,
            engineId, schemaId, normalizerId, canonId,
            approvedRevision, revisions[]}
        '304': { description: Caller holds the current representation }
        '401': { description: Anonymous }
        '403': { description: Lacks an extraction-reading role }
        '404': { description: Unknown record }
  /api/extraction/records/{id}/revisions:
    post:
      operationId: correctExtraction
      x-sovra-scopes: [ISSUER_OPS]
      summary: >-
        Append a correction revision (SOV-018). Revisions are
        append-only: the new revision supersedes the previous head
        and prior approvals no longer cover it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: object
                  additionalProperties: { type: string }
                  description: At least one non-empty field value
                confidence: { type: number, minimum: 0, maximum: 1 }
      responses:
        '201': { description: '{recordId, revision}' }
        '400': { description: Empty fields or confidence outside 0..1 }
        '401': { description: Anonymous }
        '403': { description: Lacks ISSUER_OPS }
        '404': { description: Unknown record }
  /api/extraction/records/{id}/approval:
    post:
      operationId: approveExtraction
      x-sovra-scopes: [ISSUER_OPS]
      summary: >-
        Approve the current revision (SOV-018). Only the head
        revision is approvable: approving a superseded revision
        conflicts instead of re-arming older values (AC-12).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, minimum: 1 }
      responses:
        '200': { description: '{recordId, approvedRevision}' }
        '400': { description: Revision does not exist on this record }
        '401': { description: Anonymous }
        '403': { description: Lacks ISSUER_OPS }
        '404': { description: Unknown record }
        '409': { description: Revision is superseded by a correction }
  /api/enrollments:
    post:
      operationId: createEnrollment
      x-sovra-scopes: [ISSUER_OPS]
      summary: >-
        Open an enrollment case (SOV-019, OD-14): binds one approved
        extraction revision to a fresh opaque subject reference and
        one holder P-256 key. The source must already carry an
        extraction approval; unreviewed sources conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vaultObjectId, extractionRecordId, holderJwk]
              properties:
                vaultObjectId: { type: string, format: uuid }
                extractionRecordId: { type: string, format: uuid }
                holderJwk:
                  type: object
                  description: P-256 public JWK (kty EC, crv P-256, x, y)
      responses:
        '201': { description: '{enrollmentId, subjectRef, state PENDING}' }
        '400': { description: Source/record mismatch, malformed holder key, or malformed shape }
        '401': { description: Anonymous }
        '403': { description: Lacks ISSUER_OPS }
        '404': { description: Unknown extraction record }
        '409': { description: Extraction revision is not approved }
  /api/enrollments/{id}/submit:
    post:
      operationId: submitEnrollment
      x-sovra-scopes: [ISSUER_OPS]
      summary: >-
        Submit a case for checker review (SOV-019). Pending cases
        enter review; approved cases re-enter only when the source
        moved on (explicit refresh). Current approvals stay put.
      responses:
        '200': { description: '{enrollmentId, state IN_REVIEW}' }
        '401': { description: Anonymous }
        '403': { description: Lacks ISSUER_OPS }
        '404': { description: Unknown enrollment }
        '409': { description: Case is not submittable, or approval is current }
  /api/enrollments/{id}/decision:
    post:
      operationId: decideEnrollment
      x-sovra-scopes: [ISSUER_OPS]
      summary: >-
        Decide a case in review (SOV-019, OD-14): the decider must
        differ from the creator (maker/checker), the revision must
        be the current approved extraction head, and approvals
        require a holder binding proof over the enrollment and
        revision. Decisions append to the review history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, decision]
              properties:
                revision: { type: integer, minimum: 1 }
                decision: { type: string, description: approve or reject }
                bindingProof:
                  type: string
                  description: >-
                    Required for approvals: ES256 JWS by the enrolled
                    holder key over enrollment-binding, the enrollment
                    id, and the revision
      responses:
        '200': { description: '{enrollmentId, state, boundRevision}' }
        '400': { description: Bad decision value, or missing/invalid binding proof }
        '401': { description: Anonymous }
        '403': { description: Lacks ISSUER_OPS }
        '404': { description: Unknown enrollment }
        '409': { description: Self-approval, wrong state, or stale revision }
  /api/enrollments/{id}:
    get:
      operationId: readEnrollment
      x-sovra-scopes: [ISSUER_OPS, AUDIT_READER, TRUST_ADMIN]
      summary: >-
        Read an enrollment case (SOV-019): subject and source
        references, bound revision, lifecycle state, maker/checker
        attribution, computed eligibility, and the review history.
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
          description: Strong ETag from a previous read; matches answer 304
      responses:
        '200':
          description: >-
            {enrollmentId, subjectRef, vaultObjectId,
            extractionRecordId, boundRevision, state, createdBy,
            decidedBy, eligible, eligibilityReason, reviews[]}
        '304': { description: Caller holds the current representation }
        '401': { description: Anonymous }
        '403': { description: Lacks an enrollment-reading role }
        '404': { description: Unknown enrollment }
  /api/enrollments/{id}/eligibility:
    get:
      operationId: readEnrollmentEligibility
      x-sovra-scopes: [ISSUER_OPS, AUDIT_READER, TRUST_ADMIN]
      summary: >-
        Read issuance eligibility (SOV-019, FR-39): eligible only
        while APPROVED on the current extraction head. Claims are
        the reviewed normalized fields plus the derived adult
        status; caller-supplied values never appear here.
      responses:
        '200': { description: '{enrollmentId, eligible, reason, claims}' }
        '401': { description: Anonymous }
        '403': { description: Lacks an enrollment-reading role }
        '404': { description: Unknown enrollment }
  /api/audit/events:
    get:
      operationId: listAuditEvents
      x-sovra-scopes: [AUDIT_READER, TRUST_ADMIN]
      summary: Own-tenant plus platform (global trust) decision evidence, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
          description: >-
            Opaque keyset position from the previous page's last row
            (occurred_at/id); malformed cursors are a 400
      responses:
        '200': { description: Audit rows for the caller's tenant }
        '400': { description: Malformed cursor }
        '401': { description: Anonymous }
        '403': { description: Lacks AUDIT_READER/TRUST_ADMIN }
  /api/trust/snapshots/current:
    get:
      operationId: currentSnapshot
      x-sovra-scopes: []
      summary: Public active trust snapshot (issuers, keys, epochs, RP policies)
      security: []
      responses:
        '200': { description: Active snapshot with version }
        '404': { description: No active snapshot (empty body) }
  /api/trust/proposals:
    post:
      operationId: proposeTrustChange
      x-sovra-scopes: [TRUST_ADMIN]
      summary: Maker step of the two-person trust change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuers, policies]
              properties:
                issuers:
                  type: array
                  items:
                    type: object
                    description: >-
                      Issuer row; keyVersion pins the exact authorized
                      key version (defaults to 1)
                policies: { type: array, items: { type: object } }
                note: { type: string }
      responses:
        '201': { description: version + proposalId }
        '400': { description: Profile validation failure }
        '401': { description: Anonymous }
        '403': { description: Lacks TRUST_ADMIN }
  /api/trust/proposals/{id}/approve:
    post:
      operationId: approveTrustChange
      x-sovra-scopes: [TRUST_ADMIN]
      summary: Checker step; the checker cannot be the maker
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Approved; personVerified reports the person-verified quorum verdict
          content:
            application/json:
              schema:
                type: object
                required: [proposalId, personVerified]
                properties:
                  proposalId: { type: string, format: uuid }
                  personVerified: { type: string, enum: ['true', 'false'] }
        '400': { description: Malformed id }
        '401': { description: Anonymous }
        '403': { description: Lacks TRUST_ADMIN, or self-approval }
        '404': { description: Unknown proposal (empty body) }
        '409': { description: Already decided }
  /api/trust/snapshots/{version}/activate:
    post:
      operationId: activateSnapshot
      x-sovra-scopes: [TRUST_ADMIN]
      summary: Move the active snapshot forward to an approved version
      parameters:
        - name: version
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Activated }
        '400': { description: No approved proposal, or not forward }
        '401': { description: Anonymous }
        '403': { description: Lacks TRUST_ADMIN }
  /api/trust/keys:
    post:
      operationId: registerIssuerKey
      x-sovra-scopes: [TRUST_ADMIN]
      summary: >-
        Publish an issuer key version. Registration alone never widens
        trust: only a later two-person snapshot activation authorizes
        the key. Byte-identical re-registration is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuerId, keyId, keyVersion, publicKeyJwk]
              properties:
                issuerId: { type: string }
                keyId: { type: string }
                keyVersion: { type: integer, minimum: 1 }
                publicKeyJwk:
                  type: object
                  description: P-256 public JWK with kid equal to keyId, no private material
      responses:
        '201': { description: Key view with status ACTIVE and keyVersion }
        '400': { description: Malformed identity, version, or JWK }
        '401': { description: Anonymous }
        '403': { description: Lacks TRUST_ADMIN }
        '409': { description: Same identity already names a different key }
  /api/trust/keys/revoke:
    post:
      operationId: revokeIssuerKey
      x-sovra-scopes: [TRUST_ADMIN]
      summary: >-
        Terminally revoke an issuer key version. The revocation row is
        append-only, so concurrent revokes converge on one instant;
        signing, issuance, and verification honor it live.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuerId, keyId, keyVersion, reason]
              properties:
                issuerId: { type: string }
                keyId: { type: string }
                keyVersion: { type: integer, minimum: 1 }
                reason:
                  type: string
                  description: Containment reason, 1 to 256 chars, recorded in audit
      responses:
        '200': { description: Key view with status REVOKED and revokedAt }
        '400': { description: Malformed identity or missing reason }
        '401': { description: Anonymous }
        '403': { description: Lacks TRUST_ADMIN }
        '404': { description: Unknown key identity (empty body) }
  /api/issuance/credentials:
    post:
      operationId: issueCredential
      x-sovra-scopes: [ISSUER_OPS]
      summary: >-
        Issue a synthetic credential. Retries with the same idempotency
        key and request replay the original response byte-for-byte.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuerId, vct, holderJwk, holderProof, claims, expiresAt]
              properties:
                issuerId: { type: string }
                vct: { type: string }
                holderJwk:
                  type: object
                  description: P-256 public JWK (kty EC, crv P-256, x, y)
                holderProof:
                  type: string
                  description: >-
                    ES256 JWS by the holder key over the canonical proof
                    message (label, idempotency key, vct, holder
                    thumbprint, exact claims)
                claims:
                  type: object
                  description: 'Exactly {adultOver18: true} at G1'
                expiresAt:
                  type: string
                  format: date-time
                  description: More than 1 minute out, at most 366 days
                enrollmentId:
                  type: string
                  format: uuid
                  description: >-
                    Optional enrollment binding (SOV-019): the enrollment
                    must be APPROVED on the current extraction head, the
                    issuance holder key must equal the enrolled key, and
                    every claim must equal its reviewed value
      responses:
        '201': { description: credentialId, artifact (compact JWS), status, expiresAt, trustSnapshot }
        '400': { description: Invalid request, scope, proof, validity, or enrollment binding }
        '401': { description: Anonymous }
        '403': { description: Lacks ISSUER_OPS }
        '409': { description: Same key, different request }
        '503': { description: No active trust snapshot governs issuance }
  /api/issuance/credentials/{id}:
    get:
      operationId: getCredential
      x-sovra-scopes: [TENANT_MEMBER, ISSUER_OPS]
      summary: Credential metadata and status (no artifact, no holder binding)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Metadata }
        '400': { description: Malformed id }
        '401': { description: Anonymous }
        '403': { description: Lacks TENANT_MEMBER/ISSUER_OPS }
        '404': { description: Unknown or other-tenant credential (empty body) }
  /api/issuance/credentials/{id}/status:
    get:
      operationId: credentialStatus
      x-sovra-scopes: [TENANT_MEMBER, ISSUER_OPS]
      summary: Status evidence with version, fetch time, and max age
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: '{status: VALID|REVOKED|UNKNOWN, version, fetchedAt, maxAgeSeconds}' }
        '400': { description: Malformed id }
        '401': { description: Anonymous }
        '403': { description: Lacks TENANT_MEMBER/ISSUER_OPS }
  /api/issuance/credentials/{id}/revoke:
    post:
      operationId: revokeCredential
      x-sovra-scopes: [ISSUER_OPS]
      summary: Terminal revocation (VALID becomes REVOKED, never the reverse)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: credentialId + status }
        '400': { description: Malformed id }
        '401': { description: Anonymous }
        '403': { description: Lacks ISSUER_OPS }
        '404': { description: Unknown or other-tenant credential (empty body) }
  /api/issuance/jwks.json:
    get:
      operationId: issuerKeys
      x-sovra-scopes: []
      summary: Public verification keys of authorized issuers
      security: []
      responses:
        '200': { description: JWKS with public keys only }
  /api/consent/requests:
    post:
      operationId: createProofRequest
      x-sovra-scopes: [RP_CLIENT]
      summary: >-
        Open a consent-bound proof request against a usable credential.
        The deterministic plan guard must accept the candidate plan
        and the bound hash must equal its canonical hash before any
        request is created. Binds RP, audience, purpose, exact claims,
        plan hash, challenge, holder, and expiry; the stored request
        is immutable, so later scope edits invalidate consent instead
        of widening it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rpId, audience, purpose, credentialId, claims, plan, policyId, policyVersion, planHash, challenge, expiresAt]
              properties:
                rpId: { type: string }
                audience: { type: string }
                purpose: { type: string }
                credentialId: { type: string, format: uuid }
                claims:
                  type: object
                  description: 'Exactly {adultOver18: true} at G1'
                plan:
                  type: object
                  description: Candidate plan (snake_case guard schema); must be guard-accepted
                policyId: { type: string }
                policyVersion: { type: string }
                planHash:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                  description: Canonical SHA-256 hex of the approved plan
                challenge:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{16,128}$'
                  description: Verifier nonce the consent binds
                expiresAt:
                  type: string
                  format: date-time
                  description: More than 1 minute out, at most 24 hours
      responses:
        '201': { description: Bound request in PENDING state with trustSnapshot }
        '400': { description: Invalid request, scope, claims, credential, validity, guard rejection, or plan hash mismatch }
        '401': { description: Anonymous }
        '403': { description: Lacks RP_CLIENT }
        '503': { description: No active trust snapshot governs consent }
  /api/consent/requests/{id}:
    get:
      operationId: reviewProofRequest
      x-sovra-scopes: [TENANT_MEMBER, RP_CLIENT]
      summary: >-
        Holder review: the exact bound values plus the derived consent
        state (PENDING, DENIED, UNAVAILABLE, or VERIFIED with a reason)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-None-Match
          in: header
          schema: { type: string }
          description: Exact ETag from a previous review; matches return 304
      responses:
        '200':
          description: Bound request with derived state
          headers:
            ETag:
              schema: { type: string }
              description: Strong tag over the review including derived state
        '304': { description: Caller already holds the current review }
        '400': { description: Malformed id }
        '401': { description: Anonymous }
        '403': { description: Lacks TENANT_MEMBER/RP_CLIENT }
        '404': { description: Unknown or other-tenant request (empty body, no ETag) }
  /api/consent/requests/{id}/decision:
    post:
      operationId: decideProofRequest
      x-sovra-scopes: [TENANT_MEMBER, RP_CLIENT]
      summary: >-
        Record the holder's explicit signed approve/deny decision. The
        consent proof must cover the stored request bytes exactly.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, holderJwk, consentProof]
              properties:
                decision:
                  type: string
                  enum: [approve, deny]
                holderJwk:
                  type: object
                  description: P-256 public JWK (kty EC, crv P-256, x, y)
                consentProof:
                  type: string
                  description: >-
                    ES256 JWS by the holder key over the canonical
                    consent message (label, request id, decision, RP,
                    audience, purpose, exact claims, plan hash,
                    challenge, expiry, holder thumbprint)
      responses:
        '200': { description: Request with the post-decision state }
        '400': { description: Expired, unusable credential, wrong holder, or proof mismatch }
        '401': { description: Anonymous }
        '403': { description: Lacks TENANT_MEMBER/RP_CLIENT }
        '404': { description: Unknown or other-tenant request (empty body) }
        '409': { description: Already decided }
  /api/consent/requests/{id}/presentation:
    get:
      operationId: getConsentPresentation
      x-sovra-scopes: [TENANT_MEMBER, RP_CLIENT]
      summary: >-
        Authorized presentation (holder-signed consent JWS, labelled
        synthetic), delivered only while consent is verified
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: '{requestId, state VERIFIED, synthetic, profile, presentation, claims}' }
        '400': { description: Malformed id }
        '401': { description: Anonymous }
        '403': { description: Lacks TENANT_MEMBER/RP_CLIENT }
        '404': { description: No verified consent, or other-tenant request (empty body) }
  /api/verification/presentations:
    post:
      operationId: verifyPresentation
      x-sovra-scopes: [RP_CLIENT]
      summary: >-
        Evaluate one presentation against an approved proof request and
        commit an immutable ACCEPTED, REJECTED, or UNKNOWN decision with
        its audit row. Checks signature, issuer/key scope, type/claims,
        holder, time, status freshness, audience, consent, policy, and
        the fresh nonce before acceptance; stale evidence and provider
        outages record UNKNOWN. Every decision records the actual
        authority, key, and status versions behind it. The same nonce
        replays the stored response byte-for-byte; a fresh nonce permits
        a new attempt; the same nonce with different content conflicts
        without rewriting the stored decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, nonce, audience, holderJwk, bindingProof]
              properties:
                requestId:
                  type: string
                  format: uuid
                nonce:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{16,128}$'
                  description: Verifier-chosen fresh value; one decision per nonce
                audience:
                  type: string
                  description: Session audience; must equal the consented audience
                holderJwk:
                  type: object
                  description: P-256 public JWK (kty EC, crv P-256, x, y)
                bindingProof:
                  type: string
                  description: >-
                    ES256 JWS by the holder key over the canonical
                    presentation message (label, request id, nonce,
                    audience, holder thumbprint)
      responses:
        '200': { description: '{decisionId, requestId, outcome, reasonCode, synthetic, profile, trustSnapshot, keyRef, statusVersion, decidedAt; profile is sovra-g1-synthetic/0.2 or sovra-g1-sdjwt-vc/0.2}' }
        '400': { description: Malformed submission envelope }
        '401': { description: Anonymous }
        '403': { description: Lacks RP_CLIENT }
        '404': { description: Unknown or other-tenant request (empty body) }
        '409': { description: Nonce already decided different content (original preserved) }
  /api/verification/decisions/{id}:
    get:
      operationId: getVerificationDecision
      x-sovra-scopes: [TENANT_MEMBER, RP_CLIENT]
      summary: >-
        Authorized retrieval of an already committed verification
        decision; retrieval never creates or rewrites a decision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-None-Match
          in: header
          schema: { type: string }
          description: Exact ETag from a previous read; matches return 304
      responses:
        '200':
          description: Stored decision with outcome, reason, keyRef, statusVersion,
            and the stored evaluated profile (sovra-g1-synthetic/0.2 or
            sovra-g1-sdjwt-vc/0.2)
          headers:
            ETag:
              schema: { type: string }
              description: Strong tag; decisions are immutable so the tag is stable
        '304': { description: Caller already holds the current decision }
        '400': { description: Malformed id }
        '401': { description: Anonymous }
        '403': { description: Lacks TENANT_MEMBER/RP_CLIENT }
        '404': { description: Unknown or other-tenant decision (empty body, no ETag) }
  /api/plans/propose:
    post:
      operationId: proposePlan
      x-sovra-scopes: [TENANT_MEMBER, RP_CLIENT]
      summary: >-
        Propose an untrusted candidate plan with bounded read-only
        discovery tools. The intent (RP, audience, purpose, outcome,
        policy binding, requested claims) is validated before any model
        contact. Default boot serves explicitly-labeled fixture
        candidates (mode FIXTURE, liveAcceptance false); live model
        calls happen only when the operator armed them, and provider
        faults fail as 503 without fixture fallback. The candidate
        authorizes nothing: only the guard may accept it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rpId, audience, purpose, outcome, policyId, policyVersion, requestedClaims]
              properties:
                rpId: { type: string }
                audience: { type: string }
                purpose: { type: string }
                outcome:
                  type: string
                  description: 'Exactly age_over_18 at G1'
                policyId: { type: string }
                policyVersion: { type: string }
                requestedClaims:
                  type: array
                  items: { type: string }
                  description: 'Exactly [adultOver18] at G1'
      responses:
        '200':
          description: >-
            {mode LIVE|FIXTURE, liveAcceptance, synthetic, profile, plan
            (CandidatePlanWire or null), recommendation, reason, model,
            promptVersion, toolContractVersion, toolSchemaHash, toolCalls,
            latencyMs, usageTokens, cost, snapshotVersion}
        '400': { description: Invalid intent, before any model contact }
        '401': { description: Anonymous }
        '403': { description: Lacks TENANT_MEMBER/RP_CLIENT }
        '503': { description: Live planning unavailable (planning_unavailable; retryable) }
  /api/plans/status:
    get:
      operationId: planStatus
      x-sovra-scopes: [TENANT_MEMBER, RP_CLIENT]
      summary: >-
        Planner mode and frozen versions. Reports booleans only for
        live readiness (never endpoint, model, or credential values).
      responses:
        '200':
          description: >-
            {mode LIVE|FIXTURE, liveEnabled, modelConfigured,
            promptVersion, toolContractVersion, toolSchemaHash,
            baselineVersion, tools}
        '401': { description: Anonymous }
        '403': { description: Lacks TENANT_MEMBER/RP_CLIENT }
  /api/guard/validate:
    post:
      operationId: validatePlan
      x-sovra-scopes: [TENANT_MEMBER, RP_CLIENT]
      summary: >-
        Adjudicate one untrusted candidate plan against live trust
        state and the RP-selected policy binding, before any holder
        request is created. Rejections return 200 with an explicit
        non-accepted verdict; only a malformed envelope is a 400.
        The verdict authorizes nothing by itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, policyId, policyVersion]
              properties:
                plan:
                  type: object
                  description: Candidate plan in the snake_case guard schema
                policyId: { type: string }
                policyVersion: { type: string }
      responses:
        '200': { description: '{accepted, code, reason, rulesVersion, snapshotVersion}' }
        '400': { description: Malformed plan envelope or policy binding }
        '401': { description: Anonymous }
        '403': { description: Lacks TENANT_MEMBER/RP_CLIENT }
        '503': { description: No active trust snapshot governs adjudication }
  /.well-known/openid-credential-issuer:
    get:
      operationId: vciIssuerMetadata
      x-sovra-scopes: []
      summary: >-
        Public OpenID4VCI credential-issuer metadata (SOV-036): the G1
        issuer identifier, token/credential/nonce endpoints, and the
        single sovra-adult-status-1 credential configuration
        (dc+sd-jwt, ES256, jwt proofs).
      security: []
      responses:
        '200': { description: Credential-issuer metadata document }
  /api/vci/offers:
    post:
      operationId: vciCreateOffer
      x-sovra-scopes: [ISSUER_OPS]
      summary: >-
        Publish a pre-authorized credential offer (SOV-036): stores a
        single-use 5-minute grant and returns the credential offer plus
        the openid-credential-offer URI for the wallet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuerId, vct]
              properties:
                issuerId: { type: string }
                vct: { type: string }
      responses:
        '200': { description: '{credential_offer, credential_offer_uri}' }
        '400': { description: Unknown configuration or untrusted issuer }
        '401': { description: Anonymous }
        '403': { description: Lacks ISSUER_OPS }
  /api/vci/authorize:
    post:
      operationId: vciAuthorize
      x-sovra-scopes: [TENANT_MEMBER]
      summary: >-
        Synthetic authorization server (SOV-036): the holder agent binds
        a PKCE S256 challenge and receives a single-use 5-minute
        authorization code for the wallet redemption.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuerId, vct, codeChallenge]
              properties:
                issuerId: { type: string }
                vct: { type: string }
                codeChallenge: { type: string, description: PKCE S256 challenge }
      responses:
        '200': { description: '{code, expires_in}' }
        '400': { description: Unknown configuration, untrusted issuer, or bad challenge }
        '401': { description: Anonymous }
        '403': { description: Lacks TENANT_MEMBER }
  /api/vci/token:
    post:
      operationId: vciToken
      x-sovra-scopes: []
      summary: >-
        Public wallet token redemption (SOV-036): exchanges a single-use
        pre-authorized or authorization code (PKCE-verified) for a
        5-minute bearer access token plus the first c_nonce. Unknown,
        expired, or consumed grants answer invalid_grant without
        distinguishing detail.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string }
                pre-authorized_code: { type: string }
                code: { type: string }
                code_verifier: { type: string }
          application/json:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string }
                pre-authorized_code: { type: string }
                code: { type: string }
                code_verifier: { type: string }
      responses:
        '200': { description: '{access_token, token_type Bearer, expires_in, c_nonce}' }
        '400': { description: '{error: invalid_grant|invalid_request|unsupported_grant_type}' }
  /api/vci/nonce:
    post:
      operationId: vciNonce
      x-sovra-scopes: []
      summary: >-
        Public wallet c_nonce rotation (SOV-036): mints a fresh
        single-use holder-proof nonce for a live unspent access token.
      security: []
      responses:
        '200': { description: '{c_nonce}' }
        '400': { description: '{error: invalid_token|invalid_grant}' }
  /api/vci/credential:
    post:
      operationId: vciCredential
      x-sovra-scopes: []
      summary: >-
        Public wallet credential issuance (SOV-036): consumes the
        c_nonce and issues one dc+sd-jwt credential for a jwt proof
        bound to it, through the same trust, allowlist, key,
        idempotency, and audit gates as native issuance.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, credential_configuration_id, proof]
              properties:
                format: { type: string, enum: [dc+sd-jwt] }
                credential_configuration_id: { type: string }
                proof:
                  type: object
                  required: [proof_type, jwt]
                  properties:
                    proof_type: { type: string, enum: [jwt] }
                    jwt: { type: string }
      responses:
        '200': { description: '{credentials: [{credential}]}' }
        '400':
          description: >-
            {error: invalid_token|invalid_proof|invalid_credential_request|
            invalid_request}
        '503': { description: Trust dependency unavailable }
  /api/vp/requests:
    post:
      operationId: vpCreateRequest
      x-sovra-scopes: [RP_CLIENT]
      summary: >-
        Open a VP session for one proof request (SOV-036): mints a
        5-minute session nonce and returns the request_uri serving the
        signed authorization request object (DCQL query,
        response_mode direct_post.jwt).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proofRequestId]
              properties:
                proofRequestId: { type: string, format: uuid }
      responses:
        '200': { description: '{session_id, request_uri, expires_in}' }
        '401': { description: Anonymous }
        '403': { description: Lacks RP_CLIENT }
        '404': { description: Empty; unknown proof request }
  /api/vp/requests/{id}/object:
    get:
      operationId: vpRequestObject
      x-sovra-scopes: []
      summary: >-
        Public signed authorization request object (SOV-036): ES256
        request JWT with client_id, nonce, state, DCQL query, and
        direct_post.jwt response instructions, served verbatim.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Request-object JWT (application/oauth-authz-req+jwt) }
        '400': { description: Expired session }
        '404': { description: Empty; unknown session }
  /api/vp/jwks.json:
    get:
      operationId: vpJwks
      x-sovra-scopes: []
      summary: >-
        Public verifier JWKS (SOV-036): the synthetic P-256 key for
        request-object signatures and direct_post.jwt encryption.
      security: []
      responses:
        '200': { description: '{keys: [verifier JWK]}' }
  /api/vp/responses/{id}:
    post:
      operationId: vpSubmitResponse
      x-sovra-scopes: []
      summary: >-
        Public wallet response submission (SOV-036): accepts the
        JWE-encrypted direct_post.jwt response (vp_token SD-JWT plus
        KeyBinding JWT with presentation submission and state), checks
        transport, session, and DCQL fulfillment, then commits the
        verification decision through the native gates. Unencrypted
        direct_post is rejected outside loopback harness runs.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                response: { type: string, description: direct_post.jwt JWE }
                vp_token: { type: string, description: Loopback-harness plain fallback only }
                presentation_submission: { type: string }
          application/json:
            schema:
              type: object
              properties:
                response: { type: string, description: direct_post.jwt JWE }
                vp_token: { type: string, description: Loopback-harness plain fallback only }
                presentation_submission:
                  description: Submission object or JSON string
      responses:
        '200': { description: Verification decision body (ACCEPTED, REJECTED, or UNKNOWN) }
        '400': { description: '{error: invalid_request} or invalid envelope' }
        '404': { description: Empty; unknown session }
  /api/bff/me:
    get:
      operationId: bffMe
      x-sovra-scopes: []
      summary: Current session identity, roles, and authentication context
      security: [{ bffSession: [] }]
      responses:
        '200':
          description: '{displayName, tenantId, roles (sorted), amr, authTime}'
        '401': { description: No live session }
  /api/bff/logout:
    post:
      operationId: bffLogout
      x-sovra-scopes: []
      summary: Local session logout plus RP-initiated provider logout URL
      security: [{ bffSession: [] }]
      responses:
        '200': { description: '{loggedOut: true, endSessionUrl}; the client then navigates to endSessionUrl' }
  /api/bff/consent/requests/{id}:
    get:
      operationId: bffReviewProofRequest
      x-sovra-scopes: [TENANT_MEMBER, RP_CLIENT]
      summary: Holder review of one proof request; same view and ETag behavior as reviewProofRequest
      security: [{ bffSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200': { description: Request view with ETag }
        '304': { description: ETag matches; no body }
        '401': { description: No live session }
        '403': { description: Lacks TENANT_MEMBER/RP_CLIENT }
        '404': { description: Unknown or other-tenant request (empty body) }
  /api/bff/consent/requests/{id}/decision:
    post:
      operationId: bffDecideProofRequest
      x-sovra-scopes: [TENANT_MEMBER, RP_CLIENT]
      summary: Holder signed approve/deny; same body and rules as decideProofRequest
      security: [{ bffSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, holderJwk, consentProof]
              properties:
                decision:
                  type: string
                  enum: [approve, deny]
                holderJwk:
                  type: object
                  description: P-256 public JWK (kty EC, crv P-256, x, y)
                consentProof:
                  type: string
                  description: ES256 JWS by the holder key over the canonical consent message
      responses:
        '200': { description: Request with the post-decision state }
        '400': { description: Expired, unusable credential, wrong holder, or proof mismatch }
        '401': { description: No live session }
        '403': { description: Lacks TENANT_MEMBER/RP_CLIENT, or missing/invalid CSRF token }
        '404': { description: Unknown or other-tenant request (empty body) }
        '409': { description: Already decided }
  /api/bff/consent/requests/{id}/presentation:
    get:
      operationId: bffGetConsentPresentation
      x-sovra-scopes: [TENANT_MEMBER, RP_CLIENT]
      summary: Presentation material for an approved request; same view as getConsentPresentation
      security: [{ bffSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Presentation view }
        '401': { description: No live session }
        '403': { description: Lacks TENANT_MEMBER/RP_CLIENT }
        '404': { description: Unknown or other-tenant request (empty body) }
  /api/bff/verification/presentations:
    post:
      operationId: bffVerifyPresentation
      x-sovra-scopes: [RP_CLIENT]
      summary: Evaluate one presentation; same body and decision rules as verifyPresentation
      security: [{ bffSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, nonce, audience, holderJwk, bindingProof]
              properties:
                requestId:
                  type: string
                  format: uuid
                nonce:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{16,128}$'
                audience:
                  type: string
                  description: Session audience; must equal the consented audience
                holderJwk:
                  type: object
                  description: P-256 public JWK (kty EC, crv P-256, x, y)
                bindingProof:
                  type: string
                  description: ES256 JWS by the holder key over the canonical presentation message
      responses:
        '200': { description: Same decision body as verifyPresentation }
        '400': { description: Malformed submission envelope }
        '401': { description: No live session }
        '403': { description: Lacks RP_CLIENT, or missing/invalid CSRF token }
        '404': { description: Unknown or other-tenant request (empty body) }
        '409': { description: Nonce already decided different content (original preserved) }
  /api/bff/verification/decisions/{id}:
    get:
      operationId: bffGetVerificationDecision
      x-sovra-scopes: [TENANT_MEMBER, RP_CLIENT]
      summary: Read one committed decision; same view and ETag behavior as getVerificationDecision
      security: [{ bffSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200': { description: Decision view with ETag }
        '304': { description: ETag matches; no body }
        '401': { description: No live session }
        '403': { description: Lacks TENANT_MEMBER/RP_CLIENT }
        '404': { description: Unknown or other-tenant decision (empty body) }
  /api/bff/service-accounts:
    post:
      operationId: bffCreateServiceAccount
      x-sovra-scopes: [TRUST_ADMIN]
      summary: Create a service account; same body as createServiceAccount, view plus one-time token
      security: [{ bffSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, roles]
              properties:
                name: { type: string }
                roles:
                  type: array
                  items: { type: string }
                expiresAt: { type: string, format: date-time }
      responses:
        '201': { description: Account view plus one-time token (shown once) }
        '400': { description: Invalid name, roles, or expiry }
        '401': { description: No live session }
        '403': { description: Lacks TRUST_ADMIN, or missing/invalid CSRF token }
        '409': { description: Name already exists }
    get:
      operationId: bffListServiceAccounts
      x-sovra-scopes: [TRUST_ADMIN]
      summary: List service accounts; same views as listServiceAccounts
      security: [{ bffSession: [] }]
      responses:
        '200': { description: Account views (tokens never listed) }
        '401': { description: No live session }
        '403': { description: Lacks TRUST_ADMIN }
  /api/bff/service-accounts/{id}:
    get:
      operationId: bffGetServiceAccount
      x-sovra-scopes: [TRUST_ADMIN]
      summary: Read one service account; same view as getServiceAccount
      security: [{ bffSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Account view }
        '401': { description: No live session }
        '403': { description: Lacks TRUST_ADMIN }
        '404': { description: Unknown or other-tenant account (empty body) }
  /api/bff/service-accounts/{id}/rotate:
    post:
      operationId: bffRotateServiceAccount
      x-sovra-scopes: [TRUST_ADMIN]
      summary: Replace the credential; same rules as rotateServiceAccount
      security: [{ bffSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresAt: { type: string, format: date-time }
      responses:
        '200': { description: Account view plus fresh one-time token }
        '401': { description: No live session }
        '403': { description: Lacks TRUST_ADMIN, or missing/invalid CSRF token }
        '404': { description: Unknown or other-tenant account (empty body) }
  /api/bff/service-accounts/{id}/revoke:
    post:
      operationId: bffRevokeServiceAccount
      x-sovra-scopes: [TRUST_ADMIN]
      summary: Terminally revoke the credential; idempotent, same rules as revokeServiceAccount
      security: [{ bffSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Revoked account view }
        '401': { description: No live session }
        '403': { description: Lacks TRUST_ADMIN, or missing/invalid CSRF token }
        '404': { description: Unknown or other-tenant account (empty body) }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Service-account token; tenant and roles come from the token, never from headers
    bffSession:
      type: apiKey
      in: cookie
      name: SESSION
      description: >-
        BFF session cookie from the OIDC auth-code login. Mutations
        additionally require an X-XSRF-TOKEN header matching the
        readable XSRF-TOKEN cookie.
  schemas:
    Problem:
      type: object
      description: >-
        RFC 9457 problem detail returned when the client sends
        Accept: application/problem+json. The legacy bodies stay the
        default; see api-compatibility.md for the migration rule.
      required: [type, title, status, code, correlationId, retryable]
      properties:
        type: { type: string, example: 'about:blank' }
        title: { type: string, description: Sovra error code, same as code }
        status: { type: integer }
        code:
          type: string
          description: >-
            Machine-readable Sovra code (invalid_request, forbidden:<REASON>,
            trust_unavailable, planning_unavailable, kms_unavailable,
            vault_integrity_failure, dependency_unavailable,
            already_decided, issuer_key_conflict, idempotency_conflict,
            verification_conflict, internal)
        correlationId: { type: string, description: Per-response id for support }
        retryable: { type: boolean, description: Whether retrying later can succeed }
    CandidatePlanWire:
      type: object
      description: >-
        Snake-case candidate plan wire form shared by planning and guard
        validation; see POST /api/guard/validate for the adjudication rule.
      required: [plan_id, requested_outcome, candidate_issuer_id, credential_type,
        claim_paths, evidence, policy_id, policy_version, recommendation]
      properties:
        plan_id: { type: string }
        requested_outcome: { type: string }
        candidate_issuer_id: { type: string }
        credential_type: { type: string }
        claim_paths: { type: array, items: { type: string } }
        evidence:
          type: array
          items:
            type: object
            required: [document_id, section_id]
            properties:
              document_id: { type: string }
              section_id: { type: string }
        policy_id: { type: string }
        policy_version: { type: string }
        recommendation: { type: string, enum: [CANDIDATE_ONLY, NO_PATH, MANUAL_REVIEW] }
