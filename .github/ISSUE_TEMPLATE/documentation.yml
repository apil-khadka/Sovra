name: Documentation problem
description: Report unclear, missing, or incorrect documentation.
title: "[Docs]: "
labels: [documentation, needs-triage]
body:
  - type: input
    id: location
    attributes:
      label: Document path or section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
      description: Identify whether the problem concerns a design proposal, an implementation claim, or instructions.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction and evidence
    validations:
      required: true
