name: Application checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: cd backend && ./mvnw verify
      - name: Two-instance smoke test
        run: ./scripts/smoke-two-instance.sh

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Build
        run: pnpm --dir frontend run build
      - name: Lint
        run: pnpm --dir frontend run lint

  supply-chain:
    name: Supply-chain scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Audit frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend audit --audit-level=high
      - name: Build Java SBOM
        run: cd backend && ./mvnw -q package -DskipTests
      - name: Scan lockfiles and SBOM with OSV
        uses: google/osv-scanner-action@6ad84ce1ef2d4124ba333b221894c133c4a970ea # v2.7.0
        with:
          scan-args: --lockfile=frontend/pnpm-lock.yaml --lockfile=sdk/typescript/package-lock.json --sbom=backend/target/classes/META-INF/sbom/application.cdx.json

  sdk-live:
    name: SDK live-stack suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOVRA_AI_LIVE_ENABLED: 'false'
      SOVRA_AI_API_KEY: ''
      SOVRA_AI_BASE_URL: ''
      SOVRA_AI_MODEL: ''
      SOVRA_PROFILE: synthetic
      SOVRA_SDK_BASE: http://localhost:8080
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Start disposable compose stack
        run: docker compose up --build -d
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health/ready | grep -q '"status":"READY"'; then
              exit 0
            fi
            sleep 5
          done
          echo "stack never became ready" >&2
          exit 1
      - name: Run Java SDK suite
        run: JAVA_HOME=$JAVA_HOME ./backend/mvnw -f sdk/java/pom.xml test
      - name: Run TypeScript SDK suite
        run: npm --prefix sdk/typescript ci --no-audit --no-fund && npm --prefix sdk/typescript test
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs app-a keycloak db-seed
      - name: Tear down disposable stack
        if: always()
        run: docker compose down -v

  browser-e2e:
    name: Browser journey (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [synthetic, sdjwt-vc]
    env:
      SOVRA_AI_LIVE_ENABLED: 'false'
      SOVRA_AI_API_KEY: ''
      SOVRA_AI_BASE_URL: ''
      SOVRA_AI_MODEL: ''
      SOVRA_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Start disposable compose stack
        run: docker compose up --build -d
      - name: Run browser suite
        run: pnpm --dir frontend run test:e2e
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs app-a keycloak db-seed
      - name: Tear down disposable stack
        if: always()
        run: docker compose down -v
