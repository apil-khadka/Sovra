# Test-only Spring Test knobs (classpath root, loaded via SpringProperties).
# The default context cache (32) would pin every distinct @SpringBootTest
# config — each with its own Hikari pool — against the singleton
# Testcontainers database (max 100 connections) for the whole JVM run.
# Eight keeps recently used contexts warm while evicting (and closing)
# the rest, so idle pools drain instead of accumulating to exhaustion.
# See SovraPostgresBase / test application.yaml pool bounds.
spring.test.context.cache.maxSize=8
